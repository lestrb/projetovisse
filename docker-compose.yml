version: '3.8'

services:
  # Serviço do Backend (API)
  server:
    build: ./server
    ports:
      - "3002:3002"
    env_file:
      - ./server/.env # Docker lê credenciais do Atlas 
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/uploads:/app/uploads

  # Serviço do Frontend (React)
  client:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3002
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./client:/app
      - /app/node_modules
    stdin_open: true
    tty: true